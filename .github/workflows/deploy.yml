name: Build & Deploy to GitHub Pages

# The Angular site lives in the nate-website/ subdirectory of this monorepo.
# Source is on the `archive` branch; the built site is published to `gh-pages`
# (served at nathanaelsrawley.com). All heavy work runs on GitHub's runners —
# only a small source push leaves your machine.
#
# The NoetherVim docs site is built here too, and lands at /noethervim/. Its
# source is NOT in this repo: it lives in Chiarandini/NoetherVim under
# docs-site/. That repo's `docs` workflow calls workflow_dispatch here when
# the docs change, so `workflow_dispatch` below is load-bearing, not just a
# manual convenience.
#
# It dispatches with an explicit ref rather than using repository_dispatch,
# because repository_dispatch only runs workflows on a repo's default branch
# and this file lives on `archive`.
on:
  push:
    branches: [archive]
    paths:
      - "nate-website/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: write # let GITHUB_TOKEN push the built site to gh-pages

concurrency:
  group: pages-deploy
  cancel-in-progress: true

defaults:
  run:
    working-directory: nate-website

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Angular 15 predates Node 20/22 and is not tested on them, so the app
      # build stays pinned to 18. The docs build below switches to 22, which
      # Astro 7 requires (engines: node >=22.12.0). Two setup-node calls in
      # one job is deliberate; do not collapse them.
      - name: Set up Node 18 (Angular)
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: nate-website/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (production)
        run: npm run build

      - name: SPA fallback for deep links (/series-map etc.)
        run: cp dist/testing/index.html dist/testing/404.html

      # ── NoetherVim docs ────────────────────────────────────────────────
      # Built into the same dist directory so a single publish covers both.
      # This matters: peaceiris replaces the gh-pages contents wholesale, so
      # publishing the two bundles separately would have the second wipe the
      # first.
      - name: Checkout NoetherVim
        uses: actions/checkout@v4
        with:
          repository: Chiarandini/NoetherVim
          path: noethervim-src

      - name: Set up Node 22 (Astro)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build NoetherVim docs
        working-directory: noethervim-src/docs-site
        run: |
          npm ci
          npm run build

      - name: Merge docs into the site bundle
        run: |
          mkdir -p dist/testing/noethervim
          cp -R ../noethervim-src/docs-site/dist/. dist/testing/noethervim/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./nate-website/dist/testing
          publish_branch: gh-pages
          cname: nathanaelsrawley.com
          commit_message: "Deploy ${{ github.sha }}"
