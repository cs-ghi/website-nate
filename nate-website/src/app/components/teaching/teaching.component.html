<div class="section-teaching">
  <div class="container">
    <div class="page-heading">
      <h1>Teaching</h1>
      <p class="sub">Materials from the courses I teach.</p>
      <mat-divider class="divider"></mat-divider>
    </div>

    <div class="course-grid">
      @for (c of courses; track c.slug) {
        <a class="course-card" [routerLink]="['/teaching', c.slug]">
          <div class="card-top">
            <h4 class="course-code">{{ c.code }}</h4>
            <span class="badge">{{ c.term }}</span>
          </div>
          <p class="course-title">{{ c.title }}</p>
          <p class="course-blurb">{{ c.blurb }}</p>
          <div class="card-badges">
            <span class="badge">{{ c.role }}</span>
            <span class="badge">{{ clipCount(c) }} animations</span>
          </div>
        </a>
      }
    </div>

    <div style="padding-bottom: 7em;"></div>
  </div>
</div>
