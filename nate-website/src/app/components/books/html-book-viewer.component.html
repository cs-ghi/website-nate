<div class="html-viewer-container">

  <div class="viewer-header">
    <button class="back-button" (click)="goBack()">
      <span>←</span> Back to Books
    </button>
    <h2 class="document-title">{{ bookName }}</h2>
  </div>

  <div class="viewer-body">
    @if (isLoading && !hasError) {
      <div class="loading-spinner">
        <p>Loading book…</p>
      </div>
    }

    @if (hasError) {
      <div class="error-message">
        <p>Could not load <strong>{{ bookName }}</strong>.</p>
        <p class="error-hint">The HTML version of this book may not have been built yet.<br>
          Run <code>python build.py &lt;book-dir&gt;</code> to generate it.</p>
          <button (click)="goBack()">Back to Books</button>
        </div>
      }

      @if (bookSrc && !hasError) {
        <iframe
          [src]="bookSrc"
          class="book-iframe"
          [title]="bookName"
          (load)="onLoad()"
          (error)="onError()">
        </iframe>
      }
    </div>

  </div>
