<div class="pdf-viewer-container">
  <div class="pdf-header" *ngIf="headerVisible">
    <div class="header-actions">
      <!-- Left: Title, with Contents as the primary navigation affordance -->
      <div class="header-left">
        <h2 class="document-title">{{ bookName }}</h2>

        <button class="outline-toggle" (click)="toggleOutline()" *ngIf="hasOutline"
                [class.active]="showOutline"
                [attr.aria-expanded]="showOutline" aria-controls="pdf-outline-panel"
                title="Table of contents (T)">
          <span aria-hidden="true">☰</span> Contents
        </button>
      </div>

      <!-- Center: reading controls -->
      <div class="center-controls">
        <div class="zoom-controls">
          <button class="zoom-button" (click)="zoomOut()" [disabled]="currentZoom <= 0.25">
            <span>-</span>
          </button>
          <span class="zoom-display">{{ (currentZoom * 100).toFixed(0) }}%</span>
          <button class="zoom-button" (click)="zoomIn()" [disabled]="currentZoom >= 3">
            <span>+</span>
          </button>
        </div>

        <!-- Page navigator — always visible; works in both render modes -->
        <div class="page-controls">
          <button class="page-button" (click)="prevPage()" [disabled]="currentPage <= 1"
                  title="Previous page (←)">‹</button>
          <span class="page-display">
            <input class="page-input" type="number" min="1" [max]="totalPages"
                   [value]="currentPage" (change)="onPageInput($any($event.target).value)"
                   title="Go to page" />
            <span class="page-total">/ {{ totalPages }}</span>
            <!-- What this page is printed as, where that differs from its index -->
            <span class="page-printed" *ngIf="printedPage"
                  title="This page is printed as {{ printedPage }}">· p. {{ printedPage }}</span>
          </span>
          <button class="page-button" (click)="nextPage()" [disabled]="currentPage >= totalPages"
                  title="Next page (→)">›</button>
        </div>

        <!-- Continuous ↔ one-page-at-a-time toggle -->
        <button class="mode-toggle" (click)="toggleRenderMode()"
                [title]="showAll ? 'Switch to one page at a time (faster for large books)'
                                 : 'Switch to continuous scroll'">
          <span>{{ showAll ? '▤' : '⇕' }}</span> {{ showAll ? 'Page view' : 'Scroll view' }}
        </button>
      </div>

      <!-- Right: Back Button -->
      <button class="back-button" (click)="goBack()">
        <span>←</span> {{ backButtonText }}
      </button>

      <!-- Far right: Close bar (reopen via the floating button) -->
      <button class="close-header" (click)="hideHeader()"
              title="Hide this bar for more screen space"
              aria-label="Hide top bar">×</button>
    </div>
  </div>

  <!-- Floating reopen button, shown only while the bar is hidden -->
  <button *ngIf="!headerVisible" class="reader-reopen" (click)="showHeader()"
          title="Show the toolbar" aria-label="Show toolbar">☰</button>

  <!-- Rest of your existing HTML remains the same -->
  <div class="pdf-content">
    <div *ngIf="isLoading" class="loading-spinner">
      <p>Loading PDF...</p>
    </div>

    <div *ngIf="error" class="error-message">
      <p>{{ error }}</p>
      <button (click)="goBack()">{{ returnText }}</button>
    </div>

    <div *ngIf="pdfSrc && !error" class="pdf-layout">
      <app-pdf-outline
        [pdf]="pdfDocument"
        [open]="showOutline"
        [drawer]="isDrawer"
        [currentPage]="currentPage"
        (navigate)="onOutlineNavigate($event)"
        (closeRequested)="closeOutline()"
        (availableChange)="onOutlineAvailable($event)">
      </app-pdf-outline>

      <!-- PDF viewer -->
      <div class="pdf-viewer-wrapper">
        <pdf-viewer
          *ngIf="pdfSrc && !error"
          [src]="pdfSrc"
          [render-text]="true"
          [original-size]="false"
          [fit-to-page]="true"
          [zoom]="currentZoom"
          [show-all]="showAll"
          [page]="page"
          [autoresize]="true"
          [external-link-target]="'blank'"
          [zoom-scale]="'page-width'"
          (after-load-complete)="onLoadComplete($event)"
          (error)="onError($event)"
          class="pdf-display">
        </pdf-viewer>
      </div>
    </div>
  </div>
</div>
