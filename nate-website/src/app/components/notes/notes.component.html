<div class="section-notes">
    <div class="container">
        <div class="page-heading"><h2>Notes</h2>
            <p>Articles, Papers, Translations</p>
            <mat-divider class="divider"></mat-divider>
        </div>
            <div class=row class="notes-info">
                <h3 class="mb-20">Overview</h3>
                <p>
                    Thes papers are exposition on topics that fit better in a small
                    document rather than within a textbook.

                    <!-- <li> All notes are linked in PDF format (tex file not included).</li> -->
                    <li>Disclaimer: Apologies for any typos in the notes! Feel free to send me any corrections.</li>
                    </p>

                    <!-- <p class="disclaimer-click"> <br><br> Please click on the
                    headings below to download the notes.</p> -->
            </div>

            <div class="row" class="notes-info" style="padding-bottom: 4em;"> </div>
            <div class="notes-info" *ngFor="let note of notes">
                <div class="row flexx">
                        <div class="col-sm-3 note-link" (click)="viewPdf(note)">
                            <h4 [innerHtml]="note?.name"></h4>
                        </div>
                    <div class="col-sm-9" >
                        <p [innerHtml]="note?.desc"></p>
                    </div>
                </div>
                <mat-divider class="divider-table"></mat-divider>
            </div>
        <div style="padding-bottom: 7em;"></div>

    </div>
</div>
