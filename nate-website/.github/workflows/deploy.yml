name: Build & Deploy to GitHub Pages

# Source lives on the `archive` branch; the built site is published to
# `gh-pages` (which GitHub Pages serves at nathanaelsrawley.com). All the heavy
# lifting (npm install, ng build, pushing the 200 MB+ of assets to gh-pages)
# happens on GitHub's runners — your local connection only pushes source.
on:
  push:
    branches: [archive]
  workflow_dispatch: {}

permissions:
  contents: write # let GITHUB_TOKEN push the built site to gh-pages

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (production)
        run: npm run build

      - name: SPA fallback for deep links (/series-map etc.)
        run: cp dist/testing/index.html dist/testing/404.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/testing
          publish_branch: gh-pages
          cname: nathanaelsrawley.com
          commit_message: "Deploy ${{ github.sha }}"
